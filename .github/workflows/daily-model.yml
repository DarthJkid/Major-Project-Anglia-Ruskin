name: Daily model run

# Retrains the model on a schedule, logs the experiment, promotes the best run
# to the displayed data/, and commits the results back (which triggers a
# Streamlit Community Cloud redeploy).

on:
  schedule:
    - cron: "0 3 * * *"   # every day at 03:00 UTC
  workflow_dispatch:       # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-model
  cancel-in-progress: false

jobs:
  run-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-train.txt

      - name: Run pipeline (train -> log -> promote best -> update README)
        run: python scripts/run_pipeline.py --notes "scheduled run ${{ github.run_id }}"

      - name: Commit updated predictions and experiment history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data experiments README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily model run: update predictions, experiments and metrics"
            git push
          fi
